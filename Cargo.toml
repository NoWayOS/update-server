[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The update records devices decode, from the NoWayOS clone beside this one at
# the commit nowayos.rev records: the server reads and writes them with the
# device's own code. MIT OR Apache-2.0.
nowayos-update = { path = "../nowayos/crates/nowayos-update", version = "=0.1.0" }
# RustCrypto's SHA-256, the version NoWayOS's own workspace uses. MIT OR Apache-2.0.
sha2 = { version = "0.11.0", default-features = false }

# Dev-only: the tests encode the records they build. MIT OR Apache-2.0.
nowayos-ipc = { path = "../nowayos/crates/nowayos-ipc", version = "=0.1.0" }
# Dev-only. MIT OR Apache-2.0.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
# Panicking macros `panic` does not cover.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# No panic inside a function that returns Result, and every #[allow] says why.
panic_in_result_fn = "deny"
allow_attributes_without_reason = "deny"
# No out-of-bounds panics and no unchecked arithmetic on lengths and offsets.
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[profile.release]
overflow-checks = true
panic = "abort"

[profile.dev]
panic = "abort"
